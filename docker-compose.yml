services:
  ai-service:
    build: ./ai-service
    env_file: ./ai-service/.env
    volumes:
      - ./data:/workspace/data
      - ./.hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
  discord-bot:
    build: ./discord-bot
    env_file: ./discord-bot/.env
    depends_on:
      - ai-service
    volumes:
      - ./data:/workspace/data
